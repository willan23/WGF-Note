services:
  mysql:
    image: mysql:8.4
    container_name: note-py-plus-plus-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: note_py_root_local
      MYSQL_DATABASE: note_py_plus_plus
      MYSQL_USER: note_py
      MYSQL_PASSWORD: note_py_local
    volumes:
      - note_py_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  note_py_mysql_data:
