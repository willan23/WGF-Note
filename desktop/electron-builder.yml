appId: com.wgf.note.desktop
productName: WGF Note
directories:
  app: desktop-app
  output: release
files:
  - "**/*"
extraResources:
  - from: dist
    to: dist
extraMetadata:
  main: main.cjs
asar: true
asarUnpack:
  - server-dist/**
beforeBuild: ./desktop/skip-dependency-rebuild.cjs
win:
  icon: icon.png
  target:
    - nsis
  artifactName: "WGF-Note-${version}-Setup.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
